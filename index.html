<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CESANTONI</title>
<style>
body{font-family:Arial}.center{text-align:center}
table{width:100%;border-collapse:collapse} td,th{border:1px solid #ccc;padding:6px}
.highlight{background:#ffeb3b;font-weight:bold}
</style>
</head>
<body>
<h1 class="center">CESANTONI</h1>
<div id="meta" class="center"></div>
<table>
<thead><tr><th>Producto</th><th>Fase</th><th>Cantidad</th><th>Col4</th><th>Col5</th></tr></thead>
<tbody id="tbody"></tbody>
</table>

<script>
async function main(){
  // LEE DIRECTO DE RAW PARA EVITAR CACHE DE 10 MIN DE PAGES
  const url = "https://raw.githubusercontent.com/teclgvp3-droid/Estatus-De-Productos/main/recuento_productos.tsv?ts=" + Date.now();
  const res = await fetch(url, {cache:"no-store"});
  if(!res.ok) throw new Error("No se pudo bajar TSV: " + res.status);

  const lm = res.headers.get("last-modified");
  let lmText = lm? new Date(lm).toLocaleString() : "";

  const txt = await res.text();
  const lines = txt.split(/\r?\n/).filter(l=>l.trim().length);
  let i=0;
  if(lines[i] && lines[i].toUpperCase().startsWith("AUTOESTATUS")) i++;
  if(lines[i] && lines[i].trim()==="") i++;
  if(lines[i] && lines[i].includes("Producto")) i++;

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";
  let count=0;

  for(; i<lines.length; i++){
    const cols = lines[i].split("\t");
    while(cols.length < 5) cols.push("");
    const tr=document.createElement("tr");
    for(let c=0;c<5;c++){
      const td=document.createElement("td");
      td.textContent=(cols[c]||"").trim();
      if(c==0) td.className="col-prod";
      tr.appendChild(td);
    }
    if((cols[0]||"").trim()==="Mesa vacia disponible" || (cols[0]||"").trim().startsWith("Total m²")){
      tr.classList.add("highlight");
    }
    tbody.appendChild(tr);
    count++;
  }
  document.getElementById("meta").textContent = lmText? `Última actualización: ${lmText} - Filas: ${count} | v1.4.3` : `Filas: ${count}`;
}

main().catch(e=>document.getElementById("meta").textContent="Error: "+e);
setInterval(()=>main().catch(()=>{}), 60*1000);
</script>
</body>
</html>
